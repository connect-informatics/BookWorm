name: BookWorm Clean Up
run-name: Delete untagged package versions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  PACKAGE_PREFIX: "bookworm/"
  CUTOFF_HOURS: 1

jobs:
  delete-package-versions:
    name: Delete untagged package versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete untagged container images
        uses: actions/github-script@v7
        env:
          PACKAGE_PREFIX: ${{ env.PACKAGE_PREFIX }}
          CUTOFF_HOURS: ${{ env.CUTOFF_HOURS }}
        with:
          script: |
            const org = context.repo.owner;
            const packagePrefix = process.env.PACKAGE_PREFIX || '';
            const cutoffHours = parseInt(process.env.CUTOFF_HOURS) || 1;
            
            const cutoffDate = new Date();
            cutoffDate.setHours(cutoffDate.getHours() - cutoffHours);
            
            console.log(`🔍 Configuration:`);
            console.log(`   Organization: ${org}`);
            console.log(`   Package prefix: '${packagePrefix}' (empty = all packages)`);
            console.log(`   Cutoff: ${cutoffHours} hour(s) ago (${cutoffDate.toISOString()})`);
            console.log('');
            
            console.log(`� Fetching all container packages for organization...`);
            
            // Get all container packages for the organization
            const { data: packages } = await github.rest.packages.listPackagesForOrganization({
              package_type: 'container',
              org: org,
              per_page: 100
            });
            
            // Filter packages by prefix (if specified)
            const filteredPackages = packagePrefix 
              ? packages.filter(pkg => pkg.name.startsWith(packagePrefix))
              : packages;
            
            console.log(`   Found ${filteredPackages.length} package(s) matching filter`);
            
            if (filteredPackages.length === 0) {
              console.log('⚠️  No packages found. Exiting.');
              return;
            }
            
            let totalDeleted = 0;
            
            for (const pkg of filteredPackages) {
              const packageName = pkg.name;
              console.log(`\n📦 Processing: ${packageName}`);
              
              try {
                // Get all versions for this package
                const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                  package_type: 'container',
                  package_name: packageName,
                  org: org,
                  per_page: 100
                });
                
                console.log(`   Found ${versions.length} total version(s)`);
                
                // Filter untagged versions older than cutoff
                const toDelete = versions.filter(v => {
                  const isUntagged = !v.metadata?.container?.tags || v.metadata.container.tags.length === 0;
                  const isOld = new Date(v.updated_at) < cutoffDate;
                  return isUntagged && isOld;
                });
                
                console.log(`   Found ${toDelete.length} untagged version(s) to delete`);
                
                // Delete each version
                for (const version of toDelete) {
                  console.log(`   🗑️  Deleting version ${version.id} (updated: ${version.updated_at})`);
                  await github.rest.packages.deletePackageVersionForOrg({
                    package_type: 'container',
                    package_name: packageName,
                    org: org,
                    package_version_id: version.id
                  });
                  totalDeleted++;
                }
                
                if (toDelete.length === 0) {
                  console.log(`   ✅ No versions to delete`);
                }
              } catch (error) {
                console.error(`   ❌ Error processing ${packageName}:`, error.message);
              }
            }
            
            console.log(`\n✅ Cleanup complete! Deleted ${totalDeleted} version(s) across ${filteredPackages.length} package(s).`);
